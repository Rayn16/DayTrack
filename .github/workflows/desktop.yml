# Builds DayTrack for Windows (desktop/) and publishes it as the "desktop" release,
# so the download link stays https://github.com/Rayn16/DayTrack/releases/download/desktop/DayTrack-Setup.exe
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'netlify/**', 'index.html', 'gwen-games.js', 'levels.js', 'levels.css', 'boss.ogg', 'life.js', 'ar.js', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'netlify/**', 'index.html', 'gwen-games.js', 'levels.js', 'levels.css', 'boss.ogg', 'life.js', 'ar.js', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Version 1.0.<build>: the app compares its build with the release's to know an update is out
      - run: npm pkg set version=1.0.${{ github.run_number }}
      - run: npm run dist
      # What the app's self-update does: with DayTrack running, the installer runs quietly with --updated --force-run.
      # It has to close the old app, install over it and start DayTrack again.
      - name: Update restarts DayTrack
        shell: pwsh
        run: |
          (Start-Process dist\DayTrack-Setup.exe -ArgumentList '/S' -PassThru).WaitForExit()
          Start-Process "$env:LOCALAPPDATA\Programs\daytrack-desktop\DayTrack.exe"
          Start-Sleep 15
          $old = @((Get-Process DayTrack).Id)
          if (-not $old.Count) { throw 'DayTrack did not start after installing' }
          # WaitForExit, not -Wait: -Wait would also wait for the DayTrack the installer starts
          $p = Start-Process dist\DayTrack-Setup.exe -ArgumentList '/S', '--updated', '--force-run' -PassThru; $p.WaitForExit()
          "installer exit $($p.ExitCode)"
          for ($i = 0; $i -lt 30; $i++) {
            $now = @(Get-Process DayTrack -ErrorAction SilentlyContinue)
            if ($now.Count -and -not ($now | Where-Object { $old -contains $_.Id })) { "DayTrack started again"; Stop-Process -Name DayTrack -Force; exit 0 }
            Start-Sleep 1
          }
          throw "DayTrack did not start again after the update (old: $old, now: $($now.Id))"

      - name: Publish
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop --yes --cleanup-tag || true
          gh release create desktop dist/DayTrack-Setup.exe --title "DayTrack for Windows" --notes "Run DayTrack-Setup.exe on your PC. Build ${{ github.run_number }}."
