# Builds the DayTrack Android app (android/) and publishes it as the "app" release,
# so the install link stays https://github.com/Rayn16/DayTrack/releases/download/app/DayTrack.apk
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Pull requests only check that the app builds, signed with a throwaway key
      - name: Throwaway signing key
        if: github.event_name == 'pull_request'
        run: |
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore android/release.keystore -storetype PKCS12 -alias daytrack -keyalg RSA -keysize 2048 -validity 1 -storepass "$PW" -keypass "$PW" -dname "CN=Test"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      # main gets the real key: the encrypted keystore is in android/, and its password comes from
      # the site (netlify/functions/android-key.mjs) after this run proves it is Rayn16/DayTrack's main
      - name: Signing key
        if: github.event_name != 'pull_request'
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=yasuomain" | jq -r .value)
          PW=$(curl -sSf -X POST -H "Authorization: Bearer $TOKEN" https://yasuomain.netlify.app/.netlify/functions/android-key)
          echo "::add-mask::$PW"
          openssl enc -d -aes-256-cbc -pbkdf2 -in android/release.keystore.enc -out android/release.keystore -pass "pass:$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DayTrack.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app DayTrack.apk --title "DayTrack app" --notes "Install DayTrack.apk on your phone. Build ${{ github.run_number }}."
