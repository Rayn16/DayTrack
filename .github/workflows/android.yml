# Builds the DayTrack Android app (android/, with the web app's files inside) and publishes it as the "app" release,
# so the install link stays https://github.com/Rayn16/DayTrack/releases/download/app/DayTrack.apk
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'gwen-games.js', 'levels.js', 'levels.css', 'boss.ogg', 'life.js', 'ar.js', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', 'gwen-games.js', 'levels.js', 'levels.css', 'boss.ogg', 'life.js', 'ar.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# One pull request's runs share a group with android-test-cleanup.yml: a newer push cancels the older run, and the cleanup
# waits for a running build, so a closed pull request's test app can't be published again. main keeps one group per run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Pull requests build "DayTrack test", which installs next to the real app (DT_TEST, see app/build.gradle). It's signed
      # with the test key kept in the repo (android/test.p12, password daytrack-test), never the real key, so each test
      # build installs over the last one.
      - name: Test signing key
        if: github.event_name == 'pull_request'
        run: |
          cp android/test.p12 android/release.keystore
          echo "KEYSTORE_PASSWORD=daytrack-test" >> "$GITHUB_ENV"
          echo "DT_TEST=1" >> "$GITHUB_ENV"

      # main gets the real key: the keystore is in android/ encrypted with this one password
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in android/release.keystore.enc -out android/release.keystore -pass env:PW
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DayTrack.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app DayTrack.apk --title "DayTrack app" --notes "Install DayTrack.apk on your phone. Build ${{ github.run_number }}."

      # The test app as the prerelease test-pr-<number>, for the phone to download (android-test-cleanup.yml deletes it
      # when the pull request closes). Not for pull requests from forks, which can't write releases.
      - name: Publish the test app
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-pr-${{ github.event.pull_request.number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DayTrack-test.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" DayTrack-test.apk --prerelease --target "${{ github.event.pull_request.head.sha }}" --title "DayTrack test (pull request #${{ github.event.pull_request.number }})" \
            --notes "Install DayTrack-test.apk to try this pull request. It installs next to DayTrack as \"DayTrack test\" (its own data). If it won't install over another test build, uninstall DayTrack test first. Build ${{ github.run_number }}."
          echo "Test app: https://github.com/${{ github.repository }}/releases/download/$TAG/DayTrack-test.apk" >> "$GITHUB_STEP_SUMMARY"
