// DayTrack as a real Android app: the web app's files ship inside the APK and run in a WebView,
// and the server calls go to DayTrack on Rayan's PC. No Chrome and no website needed.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rayn16.daytrack'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rayn16.daytrack'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0'
    }

    // The key lives in GitHub secrets so every build can install over the last one
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'daytrack'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    sourceSets {
        main { assets.srcDirs += layout.buildDirectory.dir('webassets') }
    }
}

// The same files the desktop app carries, copied in at build time
tasks.register('copyWeb', Copy) {
    from('../..') { include 'index.html', 'gwen-games.js', 'icon.svg', 'manifest.json' }
    into layout.buildDirectory.dir('webassets/web')
}
preBuild.dependsOn copyWeb

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
